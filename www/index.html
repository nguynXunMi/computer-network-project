<!doctype html>
<html>
<head>
    <title>bksysnet@hcmut welcome</title>

    <meta charset="utf-8" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
<div>
    <h1>bksysnet@hcmut  Domain</h1>
    <p>This domain is for use in illustrative examples in documents.</p>
    <img src="images/welcome.png" alt="bksysnet at HCMUT" width="500" height="600">
</div>

<!-- Chat Application -->
<div>
    <h1>P2P Chat (Peer: {{PEER_PORT}}) - User: <span id="whoami">Anonymous</span></h1>

    <div>
        <h2>Messages</h2>
        <div id="messages" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;">
            <!-- Messages will be loaded here -->
        </div>
    </div>

    <div>
        <h2>Send a message</h2>
        <form id="send-message-form">
            <input type="text" id="message-input" name="message" size="50" autocomplete="off"/>
            <input type="submit" value="Send"/>
        </form>
    </div>

    <div>
        <h2>Peers</h2>
        <ul id="peer-list" style="list-style-type: none; padding: 0;">
            <!-- Peers will be loaded here -->
        </ul>
        <form id="add-peer-form">
            <input type="text" id="peer-input" name="peer" placeholder="ip:port" autocomplete="off"/>
            <input type="submit" value="Add Peer"/>
        </form>
    </div>

    <div>
        <h2>Channels</h2>
        <ul id="channel-list" style="list-style-type: none; padding: 0;"></ul>
        <form id="create-channel-form" style="margin-top:8px;">
            <input type="text" id="channel-create-input" name="channel" placeholder="channel name" autocomplete="off"/>
            <input type="submit" value="Create"/>
        </form>
        <form id="join-channel-form" style="margin-top:8px;">
            <input type="text" id="channel-join-input" name="channel" placeholder="channel to join" autocomplete="off"/>
            <input type="submit" value="Join"/>
        </form>
    </div>

    <div>
        <h2>Identity</h2>
        <form id="username-form">
            <input type="text" id="username-input" name="username" placeholder="your name" autocomplete="off"/>
            <input type="submit" value="Set Username"/>
        </form>
    </div>

    <div>
        <h2>Tracker</h2>
        <form id="register-tracker-form" style="margin-top:8px;">
            <input type="text" id="tracker-register-input" name="tracker" placeholder="tracker ip:port"/>
            <input type="text" id="tracker-me-input" name="me" placeholder="me (optional ip:port)"/>
            <input type="submit" value="Register to Tracker"/>
        </form>
        <form id="sync-tracker-form" style="margin-top:8px;">
            <input type="text" id="tracker-sync-input" name="tracker" placeholder="tracker ip:port"/>
            <input type="submit" value="Sync Peers from Tracker"/>
        </form>
    </div>
</div>

<script>
    // --- Fetch messages periodically ---
    function fetchMessages() {
        fetch('/get-messages')
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = data.join('<br>');
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
    }
    setInterval(fetchMessages, 2000);
    fetchMessages();

    // --- Fetch peers periodically ---
    function fetchPeers() {
        fetch('/get-peers')
            .then(response => response.json())
            .then(data => {
                const peerList = document.getElementById('peer-list');
                peerList.innerHTML = data.map(peer => `<li>${peer}</li>`).join('');
            });
    }
    setInterval(fetchPeers, 5000);
    fetchPeers();

    // --- Handle adding peers asynchronously ---
    document.getElementById('add-peer-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const peerInput = document.getElementById('peer-input');
        const peer = peerInput.value;

        if (peer.trim() === '') return;

        const formData = new URLSearchParams();
        formData.append('peer', peer);

        fetch('/add-peer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        }).then(response => {
            if (response.ok) {
                peerInput.value = '';
                fetchPeers();
            } else {
                alert('Failed to add peer.');
            }
        }).catch(error => console.error('Error adding peer:', error));
    });

    // --- Channels ---
    let activeChannel = 'general';

    function renderChannels(list) {
        const ul = document.getElementById('channel-list');
        ul.innerHTML = list.map(ch => {
            const bold = ch.active ? 'style="font-weight:bold;"' : '';
            return `<li><button data-name="${ch.name}" ${bold}># ${ch.name} ${ch.joined ? '' : '(not joined)'}</button></li>`;
        }).join('');

        ul.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const name = btn.getAttribute('data-name');
                setActiveChannel(name);
            });
        });
    }

    function fetchChannels() {
        fetch('/list-channels')
            .then(r => r.json())
            .then(list => {
                const active = list.find(c => c.active);
                if (active) activeChannel = active.name; else activeChannel = 'general';
                renderChannels(list);
            });
    }
    setInterval(fetchChannels, 4000);
    fetchChannels();

    function setActiveChannel(name) {
        const formData = new URLSearchParams();
        formData.append('channel', name);
        fetch('/set-active-channel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        }).then(() => {
            activeChannel = name;
            fetchChannels();
            fetchMessages();
        });
    }

    document.getElementById('create-channel-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('channel-create-input').value.trim();
        if (!name) return;
        const formData = new URLSearchParams();
        formData.append('channel', name);
        fetch('/create-channel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        }).then(() => {
            document.getElementById('channel-create-input').value = '';
            fetchChannels();
        });
    });

    document.getElementById('join-channel-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('channel-join-input').value.trim();
        if (!name) return;
        const formData = new URLSearchParams();
        formData.append('channel', name);
        fetch('/join-channel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        }).then(() => {
            document.getElementById('channel-join-input').value = '';
            fetchChannels();
            fetchMessages();
        });
    });

    // --- Handle sending messages asynchronously ---
    document.getElementById('send-message-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const messageInput = document.getElementById('message-input');
        const message = messageInput.value;

        if (message.trim() === '') return;

        const formData = new URLSearchParams();
        formData.append('message', message);
        formData.append('channel', activeChannel);

        fetch('/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        }).then(response => {
            if (response.ok) {
                messageInput.value = '';
                fetchMessages();
            } else {
                alert('Failed to send message.');
            }
        }).catch(error => console.error('Error sending message:', error));
    });

    // --- Identity (username) ---
    function fetchWhoAmI() {
        fetch('/whoami')
            .then(r => r.json())
            .then(obj => {
                const el = document.getElementById('whoami');
                if (el) el.textContent = obj.user || 'Anonymous';
            });
    }
    fetchWhoAmI();

    document.getElementById('username-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('username-input').value.trim();
        if (!name) return;
        const fd = new URLSearchParams();
        fd.append('username', name);
        fetch('/set-username', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: fd
        }).then(() => {
            fetchWhoAmI();
            document.getElementById('username-input').value = '';
        });
    });

    // --- Tracker integration ---
    document.getElementById('register-tracker-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const tracker = document.getElementById('tracker-register-input').value.trim();
        const me = document.getElementById('tracker-me-input').value.trim();
        if (!tracker) return;
        const fd = new URLSearchParams();
        fd.append('tracker', tracker);
        if (me) fd.append('me', me);
        fetch('/register-to-tracker', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: fd
        }).then(res => {
            if (!res.ok) alert('Register to tracker failed');
            else fetchPeers();
        });
    });

    document.getElementById('sync-tracker-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const tracker = document.getElementById('tracker-sync-input').value.trim();
        if (!tracker) return;
        const fd = new URLSearchParams();
        fd.append('tracker', tracker);
        fetch('/sync-from-tracker', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: fd
        }).then(res => {
            if (!res.ok) alert('Sync failed');
            else fetchPeers();
        });
    });
</script>

</body>
</html>
