<!doctype html>
<html>
<head>
    <title>bksysnet@hcmut welcome</title>

    <meta charset="utf-8" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
<div>
    <h1>bksysnet@hcmut  Domain</h1>
    <p>This domain is for use in illustrative examples in documents.
    </p>
  
       <img src="images/welcome.png" alt="bksysnet at HCMUT" width="500" height="600">  
</div>

<!-- Chat Application -->
<div>
    <h1>P2P Chat</h1>
    <div>
        <h2>Messages</h2>
        <div id="messages" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;">
            <!-- Messages will be loaded here -->
        </div>
    </div>
    <div>
        <h2>Send a message</h2>
        <form action="/send-message" method="post">
            <input type="text" name="message" size="50"/>
            <input type="submit" value="Send"/>
        </form>
    </div>
    <div>
        <h2>Peers</h2>
        <form action="/add-peer" method="post">
            <input type="text" name="peer" placeholder="ip:port"/>
            <input type="submit" value="Add Peer"/>
        </form>
        <p>Note: Peer list does not auto-refresh. Add peers from each instance of the application.</p>
    </div>
</div>

<script>
    function fetchMessages() {
        fetch('/get-messages')
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = data.join('<br>');
                // Scroll to the bottom
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
    }
    // Fetch messages every 2 seconds
    setInterval(fetchMessages, 2000);
    // Initial fetch
    fetchMessages();
</script>

</body>
</html>
