<!doctype html>
<html>
<head>
    <title>bksysnet@hcmut welcome</title>

    <meta charset="utf-8" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
<div>
    <h1>bksysnet@hcmut  Domain</h1>
    <p>This domain is for use in illustrative examples in documents.
    </p>
  
       <img src="images/welcome.png" alt="bksysnet at HCMUT" width="500" height="600">  
</div>

<!-- Chat Application -->
<div>
    <h1>P2P Chat (You are on Peer: {{PEER_PORT}})</h1>
    <div>
        <h2>Messages</h2>
        <div id="messages" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;">
            <!-- Messages will be loaded here -->
        </div>
    </div>
    <div>
        <h2>Send a message</h2>
        <form id="send-message-form">
            <input type="text" id="message-input" name="message" size="50" autocomplete="off"/>
            <input type="submit" value="Send"/>
        </form>
    </div>
    <div>
        <h2>Peers</h2>
        <form action="/add-peer" method="post">
            <input type="text" name="peer" placeholder="ip:port"/>
            <input type="submit" value="Add Peer"/>
        </form>
        <p>Note: Peer list does not auto-refresh. Add peers from each instance of the application.</p>
    </div>
</div>

<script>
    // --- Fetch messages periodically ---
    function fetchMessages() {
        fetch('/get-messages')
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = data.join('<br>');
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
    }
    setInterval(fetchMessages, 2000);
    fetchMessages();

    // --- Handle sending messages asynchronously ---
    document.getElementById('send-message-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Stop page reload

        const messageInput = document.getElementById('message-input');
        const message = messageInput.value;

        if (message.trim() === '') {
            return; // Don't send empty messages
        }

        const formData = new URLSearchParams();
        formData.append('message', message);

        fetch('/send-message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData
        }).then(response => {
            if (response.ok) {
                messageInput.value = ''; // Clear input field
                fetchMessages(); // Immediately fetch new messages
            } else {
                alert('Failed to send message.');
            }
        }).catch(error => {
            console.error('Error sending message:', error);
        });
    });
</script>

</body>
</html>
